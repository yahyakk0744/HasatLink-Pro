workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: HasatLink
    environment:
      vars:
        BUNDLE_ID: "com.hasatlink.app"
        APP_STORE_APPLE_ID: "6761334964"
      node: 22
      xcode: latest
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files (self-healing)
        script: |
          set -e
          # Persistent key from Codemagic env (if set); otherwise generate fresh.
          # NOTE: Without persistent CERTIFICATE_PRIVATE_KEY, each build creates a new
          # Distribution cert on Apple. To prevent cert-limit 409, we auto-revoke
          # ALL existing Distribution certs for this team, then retry --create.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "[signing] No persistent CERTIFICATE_PRIVATE_KEY — generating fresh key."
            openssl genrsa -out /tmp/cert_key.pem 2048 2>/dev/null
            export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          else
            echo "[signing] Using persistent CERTIFICATE_PRIVATE_KEY from env."
          fi

          revoke_all_distribution_certs() {
            echo "[signing] Listing existing Distribution certs (both IOS_DISTRIBUTION and DISTRIBUTION types)…"
            # Apple uses two cert types for App Store distribution:
            # - IOS_DISTRIBUTION (legacy, iOS-specific)
            # - DISTRIBUTION (universal, newer default)
            # fetch-signing-files queries both; our revoke must too.
            echo '[]' > /tmp/certs.json
            for cert_type in IOS_DISTRIBUTION DISTRIBUTION; do
              if app-store-connect certificates list \
                   --type=$cert_type \
                   --json > /tmp/certs_$cert_type.json 2>/tmp/certs_$cert_type.err; then
                echo "[signing] certs ($cert_type):"; cat /tmp/certs_$cert_type.json
              else
                echo "[signing] certs list ($cert_type) FAILED:"; cat /tmp/certs_$cert_type.err
              fi
            done
            # Merge both JSON arrays into /tmp/certs.json via python
            python3 - <<'PY' 2>/dev/null || true
          import json
          merged = []
          for f in ('/tmp/certs_IOS_DISTRIBUTION.json', '/tmp/certs_DISTRIBUTION.json'):
              try:
                  with open(f) as fh:
                      data = json.load(fh)
                  if isinstance(data, list): merged.extend(data)
              except Exception: pass
          with open('/tmp/certs.json', 'w') as fh:
              json.dump(merged, fh)
          PY
            echo "[signing] merged certs.json:"; cat /tmp/certs.json

            # Extract IDs via python with error tolerance. Apple cert IDs are 10 chars [A-Z0-9].
            CERT_IDS=$(python3 - <<'PY' 2>/dev/null || true
          import json, re, sys
          try:
              with open('/tmp/certs.json') as fh:
                  data = json.load(fh)
              if isinstance(data, list):
                  for c in data:
                      cid = c.get('id') or c.get('Id')
                      if cid: print(cid)
          except Exception:
              # Fallback: regex scan the file for 10-char uppercase IDs.
              try:
                  with open('/tmp/certs.json') as fh:
                      for cid in set(re.findall(r'\b[A-Z0-9]{10}\b', fh.read())):
                          print(cid)
              except Exception:
                  pass
          PY
            )

            if [ -z "$CERT_IDS" ]; then
              echo "[signing] No cert IDs parsed — nothing to revoke."
              return 1
            fi

            for cert_id in $CERT_IDS; do
              echo "[signing] Revoking cert $cert_id"
              # Correct CLI is `certificates delete` (not `revoke-certificate`).
              app-store-connect certificates delete --ignore-not-found "$cert_id" || true
            done
          }

          # Primary attempt.
          if app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create; then
            echo "[signing] Primary fetch-signing-files succeeded."
          else
            echo "[signing] Primary fetch-signing-files failed — attempting recovery."
            revoke_all_distribution_certs || true
            # Apple API propagation delay after cert deletion: without this,
            # POST /certificates returns 409 "You already have a current Distribution
            # certificate or a pending certificate request." Wait ~90s.
            echo "[signing] Waiting 90s for Apple API propagation…"
            sleep 90
            echo "[signing] Retrying fetch-signing-files after revocation."
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          fi
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Install dependencies
        script: |
          cd frontend
          npm install --legacy-peer-deps
      - name: Build web
        script: |
          cd frontend
          echo "VITE_API_URL=https://hasatlink-api.onrender.com/api" > .env.production
          echo "VITE_SOCKET_URL=https://hasatlink-api.onrender.com" >> .env.production
          npm run build
      - name: Capacitor sync
        script: |
          cd frontend
          npx cap sync ios
      - name: Increment build number
        script: |
          cd frontend/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0) + 1))
      - name: Set up code signing
        script: |
          cd frontend
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Build IPA (with diagnostics)
        script: |
          set -ex
          cd frontend
          echo "=== PWD ==="
          pwd
          echo "=== ios/App contents ==="
          ls -la ios/App/
          echo "=== App.entitlements check ==="
          cat ios/App/App/App.entitlements
          echo "=== Package.swift (after cap sync) ==="
          cat ios/App/CapApp-SPM/Package.swift
          echo "=== node_modules capacitor-community ==="
          ls -la node_modules/@capacitor-community/ || echo "MISSING"
          echo "=== apple-sign-in ios dir ==="
          ls -la node_modules/@capacitor-community/apple-sign-in/ios/ || echo "MISSING"
          echo "=== facebook-login ios dir ==="
          ls -la node_modules/@capacitor-community/facebook-login/ios/ || echo "MISSING"
          echo "=== xcodebuild showBuildSettings (full stderr) ==="
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings 2>&1 | tail -80 || echo "showBuildSettings FAILED with exit $?"
          echo "=== Running xcode-project build-ipa ==="
          # On failure, Codemagic's wrapper hides xcodebuild stderr; run archive
          # directly first, piping output to a visible log, so Swift compile errors
          # surface in Build IPA step output (not just the hidden xcodebuild_logs).
          ARCHIVE_PATH="/tmp/HasatLink-$(date +%s).xcarchive"
          set +e
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=PV6SSGBWY9 \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            CODE_SIGN_STYLE=Manual 2>&1 | tee /tmp/archive_full.log
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "=== Archive exit code: $ARCHIVE_EXIT ==="
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo "=== ARCHIVE FAILED — dumping last 200 lines ==="
            tail -200 /tmp/archive_full.log
            echo "=== xcodebuild_logs contents ==="
            ls -la /tmp/xcodebuild_logs/ 2>/dev/null || echo "no xcodebuild_logs dir"
            for log in /tmp/xcodebuild_logs/*.log; do
              [ -f "$log" ] || continue
              echo "=== $log (last 100 lines) ==="
              tail -100 "$log"
            done
            exit $ARCHIVE_EXIT
          fi
          echo "=== Archive succeeded — running build-ipa for IPA export ==="
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: true
      email:
        recipients:
          - yahyakk0744@gmail.com
        notify:
          success: true
          failure: true
