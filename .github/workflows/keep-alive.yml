name: Keep Render backend awake

# Render free-tier sleeps the service after 15 min idle. Apple reviewers hit the
# login endpoint during a cold boot and we get rejected for "login returns an
# error" even though login actually works. A cheap GitHub-hosted cron ping
# every 10 min keeps the instance warm so the first real request is fast.

on:
  # GitHub Actions cron on free tier can be delayed up to ~15 min, which is
  # identical to Render's free-tier sleep interval (15 min). To eliminate the
  # risk of the backend sleeping when an App Store reviewer opens the app, we
  # run THREE staggered workflows so even with scheduling delay at least one
  # ping lands before Render's 15-min sleep timer:
  #   - keep-alive.yml        → */3 * * * *   (every 3 min)
  #   - keep-alive-b.yml      → 1-59/3 * * * * (offset +1)
  #   - keep-alive-c.yml      → 2-59/3 * * * * (offset +2)
  # Combined with cron-job.org external ping every 1 min, the backend stays
  # warm 24/7 without paying for Render's Starter plan.
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://hasatlink-api.onrender.com/api/ping -o /dev/null; then
              echo "ping ok on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "ping failed after 3 attempts"
          exit 1
