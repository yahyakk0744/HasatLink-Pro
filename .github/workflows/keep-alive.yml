name: Keep Render backend awake

# Render free-tier sleeps the service after 15 min idle. Apple reviewers hit the
# login endpoint during a cold boot and we get rejected for "login returns an
# error" even though login actually works. A cheap GitHub-hosted cron ping
# every 10 min keeps the instance warm so the first real request is fast.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://hasatlink-api.onrender.com/api/ping -o /dev/null; then
              echo "ping ok on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "ping failed after 3 attempts"
          exit 1
