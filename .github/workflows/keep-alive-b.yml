name: Keep Render backend awake (offset +1)

# Staggered companion to keep-alive.yml. Runs 1 min after the primary cron so
# if GitHub delays one workflow, the other still pings in time.

on:
  schedule:
    - cron: '1-59/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/ping
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://hasatlink-api.onrender.com/api/ping -o /dev/null; then
              echo "ping ok on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "ping failed after 3 attempts"
          exit 1
